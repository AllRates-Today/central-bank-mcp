startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      allratesApiKey:
        type: string
        title: AllRatesToday API key
        description: Optional. Without it the server runs keyless (latest published tables). A free key (format art_live_xxxxx) from https://allratestoday.com/register adds crosses, compare and calendars; dated tables need a paid plan.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@allratestoday/central-bank-mcp'],
      env: config.allratesApiKey ? { ALLRATES_API_KEY: config.allratesApiKey } : {}
    })
  exampleConfig:
    allratesApiKey: art_live_xxxxxxxxxxxxxxxxxxxxxxxx
